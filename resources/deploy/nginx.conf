# ═════════════════════════════════════════════════════════════════════════
#  courseware.mister-hope.com —— 课件深路径回退 + 站内 404（nginx）
#
#  部署产物 = 仓库 dist/ 的内容：
#    dist/index.html               入口主页
#    dist/404.html                 站内 404 页（入口网站构建时产出）
#    dist/<课件目录>/index.html     每个课件是独立 SPA，用 history 路由
#    dist/shared/…                 各课件共用的 KaTeX 字体与公共 chunk
#
#  用法（宝塔面板）：网站 → 设置 → 配置文件，把下面 ① ② ③ ④ 四段粘进已有的
#  server {} 里。root / index / listen / ssl 都是面板生成的，不要重复粘贴。
#
#  关键点：回退目标的第一段目录名用正则 $1 现取，以后新增 / 删除课件都不用改 nginx。
# ═════════════════════════════════════════════════════════════════════════

# ① 入口主页
location = / {
    try_files /index.html =404;
}

# ② 其余路径：静态文件 / 目录优先
#    （/favicon.png、/<课件>/、/<课件>/assets/… 都在这里直接命中）
location / {
    try_files $uri $uri/ @course-spa;
}

# ③ 课件 SPA 回退：/<第一段>/<任意深路径> → /<第一段>/index.html
#    例：/1.1-motion-description/1 → /1.1-motion-description/index.html
#    第一段目录不存在时这里也找不到文件，最后由 ④ 给出 404 页。
location @course-spa {
    # 带扩展名的静态资源缺失就是真 404，别回退成 HTML
    # （否则缺失的 .js / .css 会以 200 返回一段 HTML，浏览器报 MIME 错误）
    if ($uri ~ "\.[A-Za-z0-9]+$") {
        return 404;
    }

    rewrite ^/([^/]+)(?:/.*)?$ /$1/index.html last;
}

# ④ 站内 404 页：状态码保持 404，页面内容用 /404.html
error_page 404 /404.html;

# ── 改完先自检再重载 ─────────────────────────────────────────────────────
#   nginx -t && nginx -s reload
#
#   部署后核对（期望依次是 200 / 404 / 1）：
#   curl -sI https://courseware.mister-hope.com/1.1-motion-description/1 | head -1
#   curl -sI https://courseware.mister-hope.com/no-such-course/1        | head -1
#   curl -s  https://courseware.mister-hope.com/no-such-course/1 | grep -c "返回课件列表"
