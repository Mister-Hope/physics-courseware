packages:
  - courses/*
  - workspace/shared

allowBuilds:
  esbuild: true

catalog:
  "@iconify-json/mdi": ^1.2.3
  "@iconify/vue": ^5.0.3
  "@slidev/cli": ^53.0.0
  "@slidev/client": ^52.20.1
  "@slidev/theme-default": ^0.25.0
  vite: ^8.3.3
  vue: ^3.5.43

# enableGlobalVirtualStore: true

minimumReleaseAgeExclude:
  - "@mr-hope/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "oxc-config-hope"
  - "oxfmt"
  - "oxlint"
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyIgnoreAfter: 720
