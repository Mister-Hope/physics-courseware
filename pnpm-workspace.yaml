packages:
  - courses/*

allowBuilds:
  esbuild: true

catalog:
  "@iconify-json/mdi": ^1.2.3
  "@iconify/vue": ^5.0.1
  "@slidev/cli": ^52.18.0
  "@slidev/client": ^52.18.0
  "@slidev/theme-default": ^0.25.0
  vite: ^8.1.0
  vue: ^3.5.40

# enableGlobalVirtualStore: true

minimumReleaseAgeExclude:
  - "@oxfmt/*"
  - "@oxlint/*"
  - oxc-config-hope
  - oxfmt
  - oxlint

trustPolicy: no-downgrade

trustPolicyExclude:
  # babel
  - semver@6.3.1
  # node types
  - undici-types@6.21.0
