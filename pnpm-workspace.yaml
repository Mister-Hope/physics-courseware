packages:
  - courses/*
  - workspace/*

catalog:
  "@iconify-json/mdi": 1.2.3
  "@iconify/vue": 5.0.5
  "@slidev/cli": 53.1.0
  "@slidev/client": 53.1.0
  "@slidev/theme-default": 0.25.0
  "@types/three": 0.187.0
  three: 0.187.0
  vite: 8.3.8
  vue: 3.5.46

virtualStoreType: global

packageExtensions:
  "@slidev/client":
    dependencies:
      "@vue/reactivity": "^3.5.45"

permissions:
  "@slidev/cli":
    skills: true

  playwright-chromium:
    build: true

minimumReleaseAgeExclude:
  - "@mr-hope/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "oxc-config-hope"
  - "oxfmt"
  - "oxlint"
  - stylelint-config-hope@13.0.0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyIgnoreAfter: 720
skills:
  dirs:
    - .agents/skills
