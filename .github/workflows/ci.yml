name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true

      - name: Lint
        run: pnpm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true

      - name: Build all
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    env:
      E2E_CONCURRENCY: 4
      # CI 上没有 macOS 的中文字体，行高会差几像素；这里放宽判定阈值，
      # 本机默认是 2px（见 e2e/slidev-driver.ts）
      E2E_OVERFLOW_TOLERANCE: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true

      - name: Install Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E layout check
        run: pnpm run test:e2e

      - name: Upload layout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-overflow-report
          # 单课件直接跑时报告落在课件自己的 .temp 下（见 e2e/artifacts.ts），多课件/全量在 e2e/reports/
          path: |
            e2e/reports/
            courses/*/.temp/layout-overflow/
          if-no-files-found: ignore
