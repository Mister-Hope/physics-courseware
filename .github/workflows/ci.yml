name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24

      - name: Install dependencies
        run: pnpm ci

      - name: Lint
        run: pnpm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24

      - name: Install dependencies
        run: pnpm ci

      - name: Build all
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    # 全量课件由调度器（scripts/e2e.ts）**限流**跑：同时最多 E2E_CONCURRENCY 个 dev server，
    # 跑完一个课件立刻补下一个。单个 Slidev dev server 实测 ≈550MB，一次性全起 ≈13.6GB，
    # 会把 runner（4 核 / 16GB）撑爆 —— 之前就是这样跑到一半被 SIGTERM（exit 143）。
    # 课件名单不用写死在这里：调度器从 courses/ 自动发现，新加课件自动纳入。
    timeout-minutes: 45
    env:
      # CI 上没有 macOS 的中文字体，行高会差几像素；这里放宽判定阈值，
      # 本机默认是 2px（见 e2e/slidev-driver.ts）
      E2E_OVERFLOW_TOLERANCE: 6
      # 并发上限：runner 是 4 核，4 个课件并行（约 2.2GB dev server + 4 个 Chromium）
      E2E_CONCURRENCY: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.20.0

      - name: Install dependencies
        run: pnpm ci

      - name: Install Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E layout check
        run: pnpm run test:e2e

      - name: Upload layout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-overflow-report
          # 单课件直接跑时报告落在课件自己的 .temp 下（见 e2e/artifacts.ts），多课件/全量在 e2e/reports/
          path: |
            e2e/reports/
            courses/*/.temp/layout-overflow/
          if-no-files-found: ignore
