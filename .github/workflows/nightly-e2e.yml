name: Nightly E2E

# 全量兜底：选课逻辑再稳，也总会有"很久没被选中"的课件。
# 每天 03:00（Asia/Shanghai）= 19:00 UTC，跑一遍全部课件。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: true

jobs:
  e2e-full:
    name: E2E full
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # 每门课件一个 Slidev dev server + 一个 Chromium：4 门并发会把 4 vCPU 的 runner 挤满，
      # 导航/编译慢 3 倍（2026-11 就因此出过 `gotoSlideStep` 假超时），降到 3 门换稳定性。
      E2E_CONCURRENCY: 3
      E2E_OVERFLOW_TOLERANCE: 6
      # 跳页等待上限：CI 的 4 vCPU + 软件渲染下，three.js 课（o2-1.2-lorentz-force）
      # 首次进 3D 页能把主线程占住一分多钟，60s 不够（2026-11 实测）。放宽到 120s。
      E2E_NAV_TIMEOUT: 120000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.0
          require-lockfile: true

      - name: Install Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E layout check
        run: pnpm run test:e2e

      - name: Upload layout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-layout-overflow-report
          path: |
            e2e/reports/
            courses/*/.temp/layout-overflow/
          if-no-files-found: ignore
